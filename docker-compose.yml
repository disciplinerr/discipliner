services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: discipliner
      POSTGRES_USER: discipliner
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discipliner -d discipliner"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"  # web UI
      - "1025:1025"  # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://discipliner:${DB_PASSWORD}@postgres:5432/discipliner
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      DOCS_URL: ${DOCS_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Discipliner <noreply@discipliner.app>}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.db.seed &&
             python -m app.db.seed_english &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    # Resource limits to mitigate CPU/memory abuse from code execution sandbox
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    ulimits:
      nproc: 100
      nofile:
        soft: 256
        hard: 512
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
