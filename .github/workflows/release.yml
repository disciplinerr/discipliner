name: Release

# Dispara quando você empurra uma tag SemVer: vX.Y.Z (ex.: v1.2.0).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*" # pré-releases: v1.2.0-rc.1

permissions:
  contents: write # criar a GitHub Release
  packages: write # publicar imagens no GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }} # ex.: fernandohaeser/discipliner

jobs:
  # ----------------------------------------------------------------------
  # 1) Build + push das imagens (backend e frontend) para o GHCR.
  # ----------------------------------------------------------------------
  images:
    name: Build & push images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: backend
            context: ./backend
          - app: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-${{ matrix.app }}
          # Gera tags: 1.2.0, 1.2, latest (e a própria tag completa).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_API_URL é baked em build no frontend; vem de variável de repo.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}

  # ----------------------------------------------------------------------
  # 2) Cria a GitHub Release com notas geradas automaticamente.
  # ----------------------------------------------------------------------
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo p/ gerar o changelog

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Marca como pré-release se a tag tiver sufixo (-rc, -beta, etc.).
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Imagens publicadas (GHCR)

            ```
            ghcr.io/${{ github.repository }}-backend:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}-frontend:${{ github.ref_name }}
            ```
