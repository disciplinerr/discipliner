name: CI

# Roda em todo push (qualquer branch) e em todo PR.
on:
  push:
  pull_request:

# Cancela execuções antigas do mesmo ref quando chega um push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend · pytest
    runs-on: ubuntu-latest

    # Banco efêmero exigido pelos testes de integração (conftest.py).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: discipliner_test
          POSTGRES_USER: discipliner
          POSTGRES_PASSWORD: discipliner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U discipliner -d discipliner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # conftest.py lê TEST_DATABASE_URL como fallback do DATABASE_URL.
      TEST_DATABASE_URL: postgresql://discipliner:discipliner@localhost:5432/discipliner_test
      SECRET_KEY: ci-secret-key-for-pytest-only-needs-32plus-chars
      ANTHROPIC_API_KEY: test-key

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # JDK necessário para os testes/endpoint de execução de código Java.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests/ -v --maxfail=1

  frontend-build:
    name: Frontend · lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
